  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">AZA</span>
          <span class="brand-name">Technologies · Ductulator</span>
        </div>
        <button id="resetBtn" class="ghost-btn" type="button">Reset</button>
      </header>

      <main class="stage">
        <div id="wheelContainer" class="wheel-container">
          <!-- SVG layers + readout chips are injected by src/main.ts -->
        </div>
      </main>

      <section class="picker" aria-label="Set values">
        <label class="chip">
          <span class="chip-key">CFM</span>
          <input id="cfmInput" type="number" inputmode="decimal" min="30" max="100000" step="10" value="300" />
        </label>
        <span class="picker-sep">↔</span>
        <label class="chip">
          <span class="chip-key">FRICTION LOSS</span>
          <input id="frictionInput" type="number" inputmode="decimal" min="0.01" max="5" step="0.01" value="0.08" />
          <span class="chip-unit">in. wg / 100 ft</span>
        </label>
        <p class="hint">Drag the wheel to spin it. Numbers above set the alignment.</p>
      </section>
    </div>

  </body>
</html>
